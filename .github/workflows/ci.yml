name: STRIDE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: smartroute
          POSTGRES_USER: smartroute
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartroute"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartroute
          SPRING_DATASOURCE_USERNAME: smartroute
          SPRING_DATASOURCE_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-must-be-at-least-64-characters-long-for-hs512-algorithm

      - name: Build Docker Image
        run: docker build -t stride:latest .
